server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: send unknown paths (e.g. /browseroommates) to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
